    Projects:
      - name: Vora
        summary: Scalable GPU-accelerated subgraph query processing.
        highlights:
          - Developed VectorFlux in C++ on Thrust and RAPIDS Memory Manager, with heterogeneous memory support, non-owning views, and lazy operator
            fusion.
          - Implemented expansion, semi-join, and anti-join operators that produce columnar matching results.
          - Decomposed queries into tasks with bounded input-shard memory, using CPU–GPU transfer volume as the optimization objective.
          - The accepted paper reports up to 12× speedup over optimized CPU systems and up to 7× over the best GPU baseline on the evaluated workloads.
      - name: VectorHit
        summary: Ongoing research on GPU-accelerated multi-vector retrieval with cross-vector support.
      - name: TenGraph
        summary: A tensor-based graph query engine built on PyTorch.
        highlights:
          - Represented graph structure, properties, and intermediate results with one-dimensional tensors.
          - Implemented matching, filtering, projection, aggregation, and ordering through tensor operations.
          - Used one codebase for multicore CPU and GPU execution; the paper reports 50–100× GPU-versus-CPU speedups on evaluated workloads.
      - name: GCSM-BU
        summary: Continuous subgraph matching on batch updates.
        highlights:
          - Co-developed QO-CSM, a query-oriented formulation that avoids duplicate matches without explicit duplicate removal.
          - Combined two-level indexing, dynamic breadth-first/depth-first enumeration, and backtracking flattening to balance GPU parallelism, memory
            use, and workload.
